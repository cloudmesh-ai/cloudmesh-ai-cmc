[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-cmc"
dynamic = ["version"]
description = "Command Line Interface (CLI) framework for the Cloudmesh AI ecosystem, providing a registry system for managing AI-driven tools and extensions."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
urls = { "Homepage" = "https://github.com/cloudmesh-ai/cloudmesh-ai-cmc" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
keywords = ["cmc", "extension", "cli", "click", "cloudmesh"]
dependencies = [
    "click",
    "rich",
    "shellingham",
    "pytest",
    "pip-tools",
    "twine",
    "prompt_toolkit",
    "cloudmesh-ai-common",
    "cloudmesh-ai-theme",
]

[project.scripts]
cmc = "cloudmesh.ai.cmc.main:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools]
# Tells setuptools to look inside the 'src' directory for packages
package-dir = {"" = "src"}

# [project.entry-points."cloudmesh.ai.extension"]
# cmc = "extension.cmc:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloudmesh*"]
